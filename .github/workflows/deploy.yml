# Push-to-main production deploys. The native Vercel Git integration is not
# connected (the Vercel GitHub App is not installed on this repo), so this
# workflow is the deploy trigger. The CLI is pinned to the version the first
# production deploy was validated with, and the ids come from the Vercel
# project settings (Root Directory apps/toron-dev).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_6r544iAjZUYZFi1vqZlkrWdA
      VERCEL_PROJECT_ID: prj_bjITtPbAiBZfFTNRMICRkdQGbZ2s
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
      - name: Deploy production
        run: npx --yes vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
