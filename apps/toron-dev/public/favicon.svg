<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">toron.dev</title>
  <!-- The mark is unchanged. The three fills are the three dark-theme token
       values, in the order the stylesheet declares them: background, accent, ink.
       An icon is rasterised before any stylesheet exists, so it carries the values
       rather than the variables, and scripts/render-icons.mjs reads the tokens and
       fails when these three disagree with them. That check exists because this
       file kept the previous palette for weeks after the tokens moved, and no
       colour in a file nobody opens is a colour anybody notices. -->
  <rect width="64" height="64" rx="14" fill="#08090a"/>
  <path d="M15 21h34v22H15z" fill="none" stroke="#5e6ad2" stroke-width="4" stroke-linejoin="round"/>
  <path d="m16 23 16 13 16-13" fill="none" stroke="#f7f8f8" stroke-width="4" stroke-linejoin="round"/>
</svg>
